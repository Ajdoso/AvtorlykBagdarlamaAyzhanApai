<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Әкімші — кіру</title>
  <link rel="icon" href="/images/favicon.svg">
  <link rel="stylesheet" href="/fonts/geologica/wght.css">
  <link rel="stylesheet" href="/fonts/golos/wght.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="/js/admin/login.js" type="module"></script>
</head>
<body class="login-page">
  <main class="login-box">
    <img src="/images/favicon.svg" alt="" width="56" height="56">
    <h1>Әкімші панелі</h1>
    <form class="form" id="login-form" novalidate>
      <label class="field">Электрондық пошта<input class="input" type="email" name="email" autocomplete="username" required autofocus></label>
      <label class="field">Құпиясөз<input class="input" type="password" name="password" autocomplete="current-password" required></label>
      <p class="form-error" role="alert" hidden></p>
      <button class="button" type="submit">Кіру</button>
    </form>
    <a href="/">Сайтқа оралу</a>
  </main>
</body>
</html>
